; PlatformIO project - BCA182 Laboratory Activity 3 (Activity Recognition) device firmware
; Board: RT-Thread RT-Spark (STM32F407ZGT6), framework STM32Cube (HAL), RTOS FreeRTOS (CMSIS-RTOS v2).
; Pins, clock, SPI2 + its global interrupt and the RTOS tasks come from bca182-lab3-firmware.ioc (STM32CubeMX).
;
; Network stack (the board's RW007 is a Wi-Fi NIC on SPI2, so the TCP/IP stack runs on the STM32):
;   App/Src/rw007.c              RW007 SPI driver (ported from RT-Thread's rw007 package, Apache-2.0)
;   App/Src/wifi_netif.c         lwIP network interface on top of the RW007
;   App/Src/Driver_WiFi_RW007.c  CMSIS-Driver WiFi (Driver_WiFi0) used by the application, as in the lab PDF
;   coreMQTT 5.0.2               MQTT client (AWS::coreMQTT in the lab PDF)

[platformio]
src_dir = .
include_dir = Core/Inc
default_envs = rt_spark

[env:rt_spark]
platform = ststm32@20.0.0
board = black_f407zg
framework = stm32cube

board_build.stm32cube.custom_config_header = yes
board_build.stm32cube.custom_system_setup = yes
; CubeMX STM32F407xx_FLASH.ld without the (READONLY) keyword, which this GCC version does not support.
board_build.ldscript = scripts/STM32F407ZG_pio.ld

build_src_filter =
    -<*>
    +<Core/Src/>
    +<startup_stm32f407xx.s>
    +<Middlewares/Third_Party/FreeRTOS/Source/*.c>
    +<Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/>
    +<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/>
    +<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>
    +<Middlewares/Third_Party/LwIP/src/core/>
    -<Middlewares/Third_Party/LwIP/src/core/ipv6/>
    +<Middlewares/Third_Party/LwIP/src/api/>
    +<Middlewares/Third_Party/LwIP/src/netif/ethernet.c>
    +<Middlewares/Third_Party/LwIP/system/OS/sys_arch.c>
    +<Middlewares/Third_Party/coreMQTT/source/*.c>
    +<App/Src/>

build_flags =
    -D USE_HAL_DRIVER
    -D STM32F407xx
    ; Same as the lab PDF's solution.yml "define: - MQTT_DO_NOT_USE_CUSTOM_CONFIG":
    ; coreMQTT uses its default configuration.
    -D MQTT_DO_NOT_USE_CUSTOM_CONFIG
    -I Core/Inc
    -I App/Inc
    -I Drivers/CMSIS/Driver/Include
    -I Middlewares/Third_Party/FreeRTOS/Source/include
    -I Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -I Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
    -I Middlewares/Third_Party/LwIP/src/include
    -I Middlewares/Third_Party/LwIP/system
    -I Middlewares/Third_Party/coreMQTT/source/include
    -I Middlewares/Third_Party/coreMQTT/source/interface
    -Wall

extra_scripts = pre:scripts/fpu.py

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

check_tool = cppcheck
check_src_filters = +<App/Src/>
check_flags = cppcheck: --std=c11 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction

[env:native]
; PC unit tests of the hardware-independent code (pio test -e native).
platform = native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<App/Src/sensor_message.c> +<App/Src/imu_convert.c>
build_flags = -std=c11 -Wall -Wextra -Werror -static -I App/Inc
