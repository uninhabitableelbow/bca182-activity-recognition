plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.msuiit.bca182.activity'
    compileSdk 34

    defaultConfig {
        applicationId 'edu.msuiit.bca182.activity'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'          // HTTP requests (required by the lab)
    implementation 'androidx.recyclerview:recyclerview:1.3.2' // smooth scrolling history list
}
