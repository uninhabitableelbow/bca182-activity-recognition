# Mosquitto config for the Lab 3 broker.
# Mosquitto 2.x only listens on localhost by default; the board and the
# classifier need it on the network, so open port 1883 on all interfaces.
listener 1883 0.0.0.0
allow_anonymous true

# Keep the log in the console when run in the foreground.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
